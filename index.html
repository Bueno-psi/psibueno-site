<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site em Breve</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #4B5320; /* Verde Militar */
            color: #F5F5DC; /* Bege */
            font-family: 'Georgia', serif;
            text-align: center;
        }
        .container {
            padding: 40px 60px;
            border: 2px solid #F5F5DC;
            border-radius: 12px;
            background-color: rgba(245, 245, 220, 0.05); /* Fundo sutil */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 80%;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        p {
            font-size: 1.5em;
            margin-top: 0;
            line-height: 1.5;
        }
        .aviso {
            margin-top: 40px;
            font-size: 1em;
            opacity: 0.8;
            font-style: italic;
        }
        
        /* Responsividade para telas menores */
        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            p {
                font-size: 1.2em;
            }
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Em Breve</h1>
        <p>O acesso ao site será disponibilizado em breve.</p>
        <p class="aviso">Agradecemos a visita e logo traremos novidades.</p>
    </div>
</body>
</html>
